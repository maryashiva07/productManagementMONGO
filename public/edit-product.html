<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <nav>

        <h2>Admin Panel</h2>

        <div>

            <a href="/admin.html">
                Products
            </a>

            <a href="/">
                Shop
            </a>

        </div>

    </nav>


    <main>

        <div class="form-container">

            <h1>
                Edit Product
            </h1>


            <form id="editProductForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Product title"
                    required
                >


                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    required
                >


                <textarea
                    id="description"
                    placeholder="Description"
                    required
                ></textarea>


                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Image URL"
                    required
                >


                <div class="actions">

                    <button
                        type="submit"
                        class="button"
                    >
                        Update Product
                    </button>


                    <a
                        href="/admin.html"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <script src="/js/edit-product.js"></script>

</body>

</html>
