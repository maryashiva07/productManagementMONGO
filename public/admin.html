<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Products</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <nav>

        <h2>Admin Panel</h2>

        <div>

            <a href="/">
                Shop
            </a>

            <a href="/admin.html">
                Products
            </a>

        </div>

    </nav>


    <main>

        <div class="page-header">

            <h1>
                Manage Products
            </h1>

            <button
                class="button"
                onclick="showAddForm()"
            >
                Add Product
            </button>

        </div>


        <!-- ADD PRODUCT FORM -->

        <div
            id="addForm"
            class="form-container hidden"
        >

            <h2>
                Add Product
            </h2>


            <form id="addProductForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Product title"
                    required
                >


                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    required
                >


                <textarea
                    id="description"
                    placeholder="Description"
                    required
                ></textarea>


                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Image URL"
                    required
                >


                <div class="actions">

                    <button
                        type="submit"
                        class="button"
                    >
                        Add Product
                    </button>


                    <button
                        type="button"
                        class="cancel-button"
                        onclick="hideAddForm()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <div
            id="productsContainer"
            class="products"
        >
        </div>

    </main>


    <script src="/js/admin.js"></script>

</body>

</html>
